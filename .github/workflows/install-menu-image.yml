name: Install approved navigation menu image
on:
  push:
    paths:
      - 'assets/haunted-menu.jpg.base64'
      - '.github/workflows/install-menu-image.yml'
permissions:
  contents: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import pathlib,base64
          p=pathlib.Path('assets/haunted-menu.jpg.base64')
          b=base64.b64decode(p.read_text(),validate=True)
          assert b[:3]==bytes([255,216,255]) and len(b)>100000
          pathlib.Path('assets/haunted-menu.jpg').write_bytes(b)
          PY
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/haunted-menu.jpg
          git rm assets/haunted-menu.jpg.base64
          git commit -m "Install approved fourteen-card navigation artwork" || exit 0
          git pull --rebase origin main
          git push
