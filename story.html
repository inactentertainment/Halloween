<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#130f1b"><title>The Thirteen Doors · Haunted Towne</title><meta name="description" content="Read a complete nine-chapter interactive Halloween mystery through Haunted Towne."><style>
:root{color-scheme:dark}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#080506;color:#f9efe7;font:17px/1.75 Georgia,serif}a,button{font:700 15px system-ui,sans-serif}a{color:#ffd4a2}button{cursor:pointer;color:#fff0e7;background:#4f1423;border:1px solid #8c658e;border-radius:12px;padding:14px;text-align:left}button:hover,button:focus-visible{border-color:#ffb36d;background:#84263a}button[aria-pressed="true"]{background:#7e4c36;border:2px solid #ffbe80}.top{position:sticky;top:0;z-index:5;background:#110609eb;border-bottom:1px solid #55435b;backdrop-filter:blur(12px);padding:11px 16px;display:flex;justify-content:space-between;align-items:center;gap:15px}.top a{text-decoration:none;font-size:13px}.top span{color:#ffcc8d;font:700 13px system-ui}.shell{max-width:850px;margin:auto;padding:30px 20px 75px}.kicker{color:#eab179;text-transform:uppercase;letter-spacing:.2em;font:800 12px system-ui}h1,h2{font-family:Georgia,serif;line-height:1.18}h1{font-size:clamp(2.2rem,6vw,4rem);margin:16px 0 21px}h2{font-size:1.6rem}p{margin:22px 0}.lead{font-size:1.18rem;color:#d7c4d6;line-height:1.8}.panel{background:linear-gradient(150deg,#270c15,#100608);border:1px solid #71303e;border-radius:18px;padding:clamp(21px,5vw,43px);margin:25px 0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.navbtn,.choice{display:inline-block;background:linear-gradient(130deg,#9e2338,#67101f);color:#fff3e9;border:0;border-radius:999px;text-decoration:none;padding:13px 20px;font-weight:800}.choice{width:100%;border-radius:12px;text-align:left;background:#42121e;color:white;border:1px solid #796081}.choice[aria-pressed=true]{background:#8e2636;color:white;border-color:#e6b27b}.actions{display:flex;gap:12px;flex-wrap:wrap;margin:23px 0}.secondary{border:1px solid #7b617f;border-radius:999px;padding:12px 17px;text-decoration:none;font:700 14px system-ui}.notice{border-left:4px solid #e5a569;padding:15px 20px;background:#332532;margin:22px 0}.hidden{display:none!important}.chapter-link{display:block;background:#240d15;border:1px solid #644d6c;border-radius:12px;padding:13px 16px;text-decoration:none}.chapter-link span{display:block;font:13px system-ui;color:#c4b5c8}.chapter-link:hover{background:#5a1828}.progress{background:#3d3442;height:8px;border-radius:99px;overflow:hidden}.progress>div{height:100%;background:#efad71}.status{font:14px system-ui;color:#d5b9cd}footer{border-top:1px solid #473a4e;text-align:center;padding:24px;font:12px system-ui;color:#bcaabb}button:focus-visible,a:focus-visible{outline:3px solid #ffc48c;outline-offset:4px}@media(max-width:550px){.grid{grid-template-columns:1fr}.top span{display:none}body{font-size:16px}.shell{padding:20px 14px 60px}}@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}} 
</style><link rel="stylesheet" href="./reader-bar.css">
</head><body><header class="top"><a href="./index.html#home">🎃 Haunted Towne · Home</a><span>The Thirteen Doors — Interactive Story</span><a href="./history.html">History of Halloween</a></header><main class="shell" id="main" aria-live="polite"></main><footer>Original story © InAct Entertainment LLC · Progress stays in this browser.</footer>
<script>
"use strict";
const chapters=[["The Cemetery Gate","At 11:47 p.m., the last bus leaves you in Ravenhill. A sign reads POPULATION 0, but orange lights burn in every window of the mansion above the cemetery. A woman in a gray coat introduces herself as Mara Vale, the keeper of the town's forgotten records.","Mara says the thirteen founding families made a promise to protect one another. On Halloween night, one bell stopped ringing, the clock stopped, and the town vanished from the memories of the outside world. She gives you a ledger of empty names.","A single brass key lies among the gravestones. Mara warns you that the key unlocks no door; it unlocks the truth about whoever carries it. Then you notice a child's red ribbon tied to the cemetery gate.","Mara opens the gate and asks you to walk the road. Only someone who is willing to remember the forgotten can reach its end.",["Carry Mara's lantern","Take the brass key"],"The first ledger page holds a single word: REMEMBER."],["The Witch's Realm","The very same cobblestone road runs downhill into Crooked Willow Lane. No second moon appears above the cottages. The only light comes from lanterns hanging on crooked doors and a strange green glow inside a witch's cauldron.","Mother Ash, the oldest resident of Ravenhill, invites you into her kitchen. She shows you a faded photograph of a harvest feast. All the faces have disappeared except that of a child in a red coat.","'Her name was Elowen,' says Mother Ash. 'The founders were afraid of losing their town. They believed the thirteenth bell could lock away their fear. Instead, they asked it to swallow one child's name.'","The cauldron becomes still. On its dark surface you see the clock tower at the town square and the words THE BELLS LIED.",["Keep the photograph safe","Ask Mother Ash for the full story"],"Elowen was the first person the town agreed to forget."],["The Forgotten Neighborhood","The road enters Hollow Street, where neat homes stand with their porch lights burning. A tricycle rolls across the empty road without a rider. A dining room window reveals a table set for thirteen.","Inside Number 13, a radio crackles. A girl's voice says, 'My name is Elowen. The people who should have protected me chose silence instead.' Every framed family photograph in the room has a face carefully painted over.","You find a paper star beneath a chair. Written on it is a warning: DO NOT BREAK THE CLOCK. ASK WHY IT STOPPED. The radio plays a lullaby that sounds exactly like the bell in the cemetery.","Footsteps approach from the upstairs landing. There is nobody there, yet the front door swings open as though the house itself wants you to continue.",["Study the portraits","Follow the radio's voice"],"Each of the thirteen families signed an agreement to forget Elowen."],["The Cursed Town Square","A silent market square appears around the bend. The clock tower has thirteen marks around its face and points to one minute before midnight. Beneath it is a fountain of black stone with a weeping angel.","In the town hall lies the founders' agreement. Twelve signatures have been crossed out. The thirteenth belongs to Gideon Vale, Mara's grandfather, who was the bell keeper. His name has faded almost completely.","Mara confesses that Gideon did not destroy the thirteenth bell. He hid it because he could not bear what he had done. The pact promised protection, but when the town faced a hard choice, its leaders betrayed that promise.","You climb into the clock tower. The gears are not broken; a child's folded paper star has stopped them. Someone wanted the town to pause long enough to face the truth.",["Read the pact aloud","Take the star from the gears"],"The town was trapped by a choice made out of fear, not by a monster."],["The Abandoned Carnival","The road winds into a carnival where an empty Ferris wheel turns one car at a time. The carousel plays a tune missing its last note, and the painted horses seem to watch you cross the midway.","At the ticket booth, a translucent seller offers you a ticket in exchange for a memory. You refuse. He smiles. 'That is better than the others did. You cannot repair a stolen memory by stealing another.'","Behind the carousel, you find a small bell tied with Elowen's red ribbon. It is too small to be the missing thirteenth bell, but its tone rings across the whole town. A shadow falls over the path: the old schoolhouse waits beyond the tents.","The seller whispers that the lost bell is in the Black Cathedral and that the town must speak every forgotten name before it can ring again.",["Take the ribbon","Return the seller's tickets"],"A repaired promise cannot demand another person's sacrifice."],["The Haunted Schoolhouse","The old school stands beyond the carnival. Its bell rings thirteen times even though the rope has rotted away. You enter the classroom marked HISTORY, where dusty notebooks lie open on every desk.","Every child was once asked to write one thing they were afraid to say. The pages remain blank except for a sentence that appears as you approach: I SAW THEM CHOOSE HER.","In the teacher's journal, you learn that the children saw the pact and were ordered never to speak of it. They grew older and taught their own children to keep silent, until forgetting became the town's only tradition.","Elowen's desk contains an unfinished essay titled WHAT MAKES A HOME. It reads: A PLACE WHERE SOMEONE WILL SAY MY NAME.",["Read Elowen's essay aloud","Carry the teacher's journal"],"The truth was handed from generation to generation in the form of silence."],["The Forsaken Infirmary","The road passes through iron gates and climbs toward an abandoned infirmary. Its windows glow an impossible green. In a garden behind the building, pale flowers bloom despite the October frost.","Inside are shelves of sealed glass jars. Each contains a slip of paper bearing a forgotten name. Gideon hid the names here rather than destroying them, hoping someone would someday have the courage to return them.","A letter addressed to Elowen lies inside a locked drawer. Gideon wrote: I THOUGHT FORGETTING WOULD STOP THE HURT. I ONLY MADE IT LAST FOREVER. Mara reads the letter twice before carefully folding it.","In a mirror you see the town as it once was: people shopping, laughing, disagreeing, apologizing, and coming home. The vision fades. Beyond the garden is the Bridge of Lost Souls.",["Take Gideon's confession","Memorize the map to the cathedral"],"The townspeople can return, but only if they acknowledge what happened."],["The Bridge of Lost Souls","The road crosses black water without a reflection. Lantern-bearing figures wait along the parapet. They are the people whose memories and names were taken, and each lantern flickers as you approach.","Elowen stands halfway across in the red coat from the photographs. She asks, 'Everyone worries what will happen if the thirteenth bell rings. Why does nobody ask what happens if it never does?'","You tell her what you have discovered: the pact, the clock, the journal, Gideon's confession, and the hidden names. She listens without interrupting. 'Then tell the truth,' she says. 'Not only the part that makes you feel brave.'","Mara joins you. For the first time the ghosts walk together, their lanterns illuminating a final stretch of road leading to a cathedral beneath red clouds.",["Invite everyone across together","Promise Elowen you will speak her name"],"Elowen does not need a rescuer. Ravenhill needs to stop pretending she never lived."],["The Black Cathedral","The great doors of the Black Cathedral stand open at the end of the road. Twelve bells hang in the tower, each reflecting the face of a forgotten resident. The empty space in their center is waiting for the thirteenth.","Mara carries the ledger to the altar. Elowen sets down the little ribbon. Behind the altar rests the true thirteenth bell, engraved with the words LET THE TRUTH BE HEARD, EVEN WHEN IT HURTS.","The clock begins to move. You realize that there is no secret password, monster to defeat, or villain to chase. The town has waited a century for someone to tell the story as it happened, including the betrayal.","Everyone gathers, watching your final decision. Will you ring the bell and speak the truth, or keep the comfortable silence that has held the town in place?",["Ring the bell and tell the truth","Leave the bell silent"],"Your choice determines Ravenhill's ending."]];
const main=document.getElementById("main");
const storageKey="haunted-towne-story-standalone-v1";
function read(){try{return JSON.parse(localStorage.getItem(storageKey))||{decisions:{},at:0}}catch{return{decisions:{},at:0}}}
function save(p){try{localStorage.setItem(storageKey,JSON.stringify(p))}catch{}}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function link(page,title,css="secondary"){return '<a class="'+css+'" href="#'+page+'">'+escapeHtml(title)+'</a>'}
function paint(content){main.innerHTML=content;window.scrollTo({top:0,behavior:"instant"})}
function landing(){const p=read();paint('<div class="kicker">Original Interactive Halloween Mystery</div><h1>The Thirteen Doors of Haunted Towne</h1><p class="lead">One road. Nine chapters. Two endings. Help Mara Vale and Elowen unravel why Ravenhill vanished — and decide whether the forgotten town will see morning again.</p><div class="panel"><h2>How to play</h2><p>Read each chapter and choose one of two actions. Your selection reveals what you discovered and unlocks the next chapter. <strong>No quiz, no timer, no jump scares.</strong> Your choices save automatically on this device.</p><div class="status">'+Object.keys(p.decisions).length+' of 9 chapter decisions completed</div><div class="progress"><div style="width:'+(Object.keys(p.decisions).length/9*100)+'%"></div></div><div class="actions">'+link('chapter-'+Math.min(p.at,8),p.at?'Continue story':'Start chapter one','navbtn')+'</div></div><h2>Chapters</h2><div class="grid">'+chapters.map((c,i)=>'<a class="chapter-link" href="#chapter-'+i+'">'+(i+1)+'. '+escapeHtml(c[0])+'<span>'+(p.decisions[i]===undefined?'Not yet read':'Decision saved ✓')+'</span></a>').join('')+'</div>');}
function chapter(i){const x=chapters[i];if(!x){landing();return}const p=read(),selected=p.decisions[i];const body='<div class="kicker">Chapter '+(i+1)+' of 9</div><h1>'+escapeHtml(x[0])+'</h1><div class="panel">'+x.slice(1,5).map(t=>'<p>'+escapeHtml(t)+'</p>').join('')+'<h2>What do you do?</h2><p class="status">Choose either action. Both move the story forward.</p><div class="grid">'+x[5].map((c,j)=>'<button type="button" class="choice" aria-pressed="'+(selected===j)+'" data-option="'+j+'">'+escapeHtml(c)+'</button>').join('')+'</div><div id="reveal">'+(selected===undefined?'<p class="status">Select an action to continue.</p>':discovery(i))+'</div></div><div class="actions">'+(i?link('chapter-'+(i-1),'← Previous chapter'):'')+link('start','Chapter list')+'</div>';
paint(body);
document.querySelectorAll('[data-option]').forEach(b=>b.addEventListener('click',()=>{const state=read();state.decisions[i]=Number(b.dataset.option);state.at=Math.max(i+1,state.at);save(state);document.querySelectorAll('[data-option]').forEach(el=>el.setAttribute('aria-pressed',String(el===b)));document.getElementById('reveal').innerHTML=discovery(i);document.getElementById('reveal').scrollIntoView({block:'nearest'});}));
}
function discovery(i){return '<div class="notice"><strong>Discovery:</strong> '+escapeHtml(chapters[i][6])+'</div><div class="actions">'+link(i===8?'ending':'chapter-'+(i+1),i===8?'Read your ending →':'Continue to chapter '+(i+2)+' →','navbtn')+'</div>'}
function ending(){const p=read();if(p.decisions[8]===undefined){location.hash='chapter-8';return;}const good=p.decisions[8]===0;const story=good?[
'You ring the thirteenth bell. One clear note crosses the bridge, passes the infirmary, moves through the school and carnival, and fills every empty home. Names return to the ledger. People emerge into the streets, remembering the lives they had forgotten.',
'Mara speaks Gideon’s confession aloud. The town refuses to pretend the wrong was harmless. Its people agree to preserve Elowen’s story and repair whatever they can.',
'For the first time in a century, morning rises over Ravenhill. Elowen smiles as the clock moves forward. The town is not perfect, but it is home again.'
]:[
'You leave the thirteenth bell silent. The cathedral darkens and the townspeople return to the mist. No one blames you; they know how difficult the choice can be.',
'Elowen ties her ribbon to the bell so the next visitor will find it. The clock still reads one minute before midnight. The town waits for someone else to remember.',
'Mara walks you to the cemetery gate. “A story remains unfinished whenever someone believes its ending cannot change,” she says. The road is open if you wish to begin again.'
];paint('<div class="kicker">The End · Your final decision</div><h1>'+(good?'The Morning That Returned':'The Road That Waits')+'</h1><div class="panel">'+story.map(x=>'<p>'+escapeHtml(x)+'</p>').join('')+'<p class="notice">Thank you for visiting Haunted Towne. A town is made of the stories its people choose to remember.</p><div class="actions"><button class="navbtn" id="restart">Begin a new journey</button>'+link('start','View all chapters')+'</div></div>');document.getElementById('restart').onclick=()=>{save({decisions:{},at:0});location.hash='chapter-0'};}
function router(){let target=location.hash.slice(1)||'start';if(target==='start')landing();else if(target==='ending')ending();else if(/^chapter-[0-8]$/.test(target))chapter(Number(target.slice(-1)));else landing();}
window.addEventListener('hashchange',router);router();
</script><script defer src="./reader-bar.js"></script>
</body></html>
